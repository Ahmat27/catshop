<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produk – CatShop</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{font-family:'Nunito',sans-serif;}

body{background:#faf7ff;min-height:100vh;}

/* ── TOPBAR ── */
.topbar{
  background:white;
  border-radius:25px;
  margin:20px;
  padding:18px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 8px 24px rgba(255,79,135,.10);
}
.logo{font-size:26px;font-weight:800;color:#ff4f87;}
.menu{display:flex;gap:10px;flex-wrap:wrap;}
.menu a{
  text-decoration:none;color:#555;
  background:#fff5f8;padding:9px 18px;
  border-radius:30px;font-weight:700;font-size:.88rem;
  transition:.25s;
}
.menu a:hover,.menu a.active{background:#ff4f87;color:white;}

/* ── PAGE ── */
.page{padding:0 20px 30px;}

/* ── STAT CARDS ── */
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px;}
.stat{
  background:white;border-radius:22px;
  padding:22px 20px;text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,.06);
}
.stat .icon{font-size:2rem;margin-bottom:6px;}
.stat .number{font-size:1.8rem;font-weight:800;color:#ff4f87;}
.stat .label{font-size:.82rem;color:#888;font-weight:600;}

/* ── TOOLBAR ── */
.toolbar{
  background:white;border-radius:22px;
  padding:18px 22px;margin-bottom:20px;
  display:flex;gap:12px;flex-wrap:wrap;align-items:center;
  box-shadow:0 6px 18px rgba(0,0,0,.06);
}
.toolbar input,.toolbar select{
  border:2px solid #ffe0ec;border-radius:14px;
  padding:9px 14px;font-size:.9rem;font-family:'Nunito',sans-serif;
  outline:none;transition:.2s;
}
.toolbar input:focus,.toolbar select:focus{border-color:#ff4f87;}
.toolbar input{flex:1;min-width:180px;}
.btn-pink{
  background:#ff4f87;color:white;border:none;
  border-radius:14px;padding:9px 20px;
  font-weight:700;font-family:'Nunito',sans-serif;
  cursor:pointer;transition:.2s;white-space:nowrap;
}
.btn-pink:hover{background:#e63f75;}

/* ── GRID PRODUK ── */
.product-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:20px;
}
.prod-card{
  background:white;border-radius:24px;
  padding:22px;text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,.06);
  transition:.25s;
  position:relative;overflow:hidden;
}
.prod-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(255,79,135,.15);}
.prod-card .badge-stok{
  position:absolute;top:14px;right:14px;
  background:#fff5f8;color:#ff4f87;
  font-size:.75rem;font-weight:800;
  padding:4px 10px;border-radius:20px;
}
.prod-card .badge-stok.low{background:#fff0f0;color:#e53935;}
.prod-icon{font-size:3.2rem;margin:10px 0 14px;}
.prod-card h6{font-weight:800;margin-bottom:4px;color:#333;}
.prod-card .kategori{font-size:.8rem;color:#aaa;margin-bottom:10px;}
.prod-card .harga{font-size:1.15rem;font-weight:800;color:#ff4f87;margin-bottom:14px;}
.prod-card .terjual{font-size:.8rem;color:#999;}
.card-actions{display:flex;gap:8px;justify-content:center;margin-top:14px;}
.btn-edit{
  flex:1;background:#fff5f8;color:#ff4f87;border:none;
  border-radius:12px;padding:8px;font-weight:700;
  font-family:'Nunito',sans-serif;cursor:pointer;transition:.2s;font-size:.85rem;
}
.btn-edit:hover{background:#ffd9e8;}
.btn-del{
  flex:1;background:#fff0f0;color:#e53935;border:none;
  border-radius:12px;padding:8px;font-weight:700;
  font-family:'Nunito',sans-serif;cursor:pointer;transition:.2s;font-size:.85rem;
}
.btn-del:hover{background:#ffd7d7;}

/* ── MODAL ── */
.overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.35);backdrop-filter:blur(4px);
  z-index:1000;justify-content:center;align-items:center;
}
.overlay.show{display:flex;}
.modal-box{
  background:white;border-radius:28px;
  padding:35px;width:460px;max-width:95vw;
  box-shadow:0 20px 50px rgba(0,0,0,.15);
  animation:popIn .25s ease;
}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-box h5{font-weight:800;color:#ff4f87;margin-bottom:22px;}
.modal-box label{font-weight:700;font-size:.88rem;color:#555;margin-bottom:5px;display:block;}
.modal-box input,.modal-box select,.modal-box textarea{
  width:100%;border:2px solid #ffe0ec;border-radius:14px;
  padding:10px 14px;font-family:'Nunito',sans-serif;
  font-size:.9rem;outline:none;transition:.2s;margin-bottom:14px;
}
.modal-box input:focus,.modal-box select:focus,.modal-box textarea:focus{border-color:#ff4f87;}
.modal-actions{display:flex;gap:10px;margin-top:6px;}
.btn-cancel{
  flex:1;background:#f5f5f5;color:#666;border:none;
  border-radius:14px;padding:11px;font-weight:700;
  font-family:'Nunito',sans-serif;cursor:pointer;transition:.2s;
}
.btn-cancel:hover{background:#e8e8e8;}

/* ── EMPTY ── */
.empty{text-align:center;padding:60px 20px;color:#ccc;}
.empty .icon{font-size:3.5rem;margin-bottom:12px;}
.empty p{font-weight:700;font-size:1rem;}

/* ── TOAST ── */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:2000;}
.toast-msg{
  background:#333;color:white;padding:12px 20px;
  border-radius:16px;font-weight:700;font-size:.88rem;
  margin-top:8px;animation:slideUp .3s ease;
}
.toast-msg.success{background:#ff4f87;}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.badge-role{padding:6px 14px;border-radius:20px;font-size:.78rem;font-weight:800;}
.badge-role.admin{background:#fff0f7;color:#ff4f87;}
.badge-role.pengguna{background:#f0f7ff;color:#3b82f6;}
.menu a.disabled{background:#f0f0f0;color:#bbb;cursor:not-allowed;pointer-events:none;}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">🐱 CatShop</div>
  <div class="menu" id="navMenu"></div>
</div>

<div class="page">

  <!-- STAT -->
  <div class="stat-cards">
    <div class="stat"><div class="icon">🐱</div><div class="number" id="totalProduk">0</div><div class="label">Total Produk</div></div>
    <div class="stat"><div class="icon">✅</div><div class="number" id="stokAman">0</div><div class="label">Stok Aman</div></div>
    <div class="stat"><div class="icon">⚠️</div><div class="number" id="stokRendah">0</div><div class="label">Stok Rendah</div></div>
    <div class="stat"><div class="icon">📦</div><div class="number" id="totalKategori">0</div><div class="label">Kategori</div></div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="🔍  Cari produk..." oninput="loadProduk()">
    <select id="filterKat" onchange="loadProduk()">
      <option value="">Semua Kategori</option>
      <option>Makanan</option>
      <option>Pasir</option>
      <option>Mainan</option>
      <option>Aksesoris</option>
      <option>Kandang</option>
      <option>Kesehatan</option>
    </select>
    <button class="btn-pink" id="btnTambah" onclick="bukaModal()" style="display:none">+ Tambah Produk</button>
  </div>

  <!-- GRID -->
  <div class="product-grid" id="productGrid"></div>
  <div class="empty" id="emptyState" style="display:none">
    <div class="icon">🐾</div>
    <p>Belum ada produk yang ditemukan.</p>
  </div>

</div>

<!-- MODAL TAMBAH / EDIT -->
<div class="overlay" id="modalOverlay">
  <div class="modal-box">
    <h5 id="modalTitle">Tambah Produk</h5>
    <input type="hidden" id="editId">
    <label>Nama Produk</label>
    <input type="text" id="fNama" placeholder="contoh: Makanan Kucing Premium">
    <label>Kategori</label>
    <select id="fKat">
      <option>Makanan</option>
      <option>Pasir</option>
      <option>Mainan</option>
      <option>Aksesoris</option>
      <option>Kandang</option>
      <option>Kesehatan</option>
    </select>
    <label>Harga (Rp)</label>
    <input type="number" id="fHarga" placeholder="120000" min="0">
    <label>Stok</label>
    <input type="number" id="fStok" placeholder="25" min="0">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="tutupModal()">Batal</button>
      <button class="btn-pink" style="flex:1" onclick="simpanProduk()">Simpan</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast-wrap" id="toastWrap"></div>

<script>
// ── GANTI: localStorage → fetch Flask API ──
let nama = sessionStorage.getItem('namaUser');
let role = sessionStorage.getItem('roleUser');
if(!nama){ window.location.href='login.html'; }

const isAdmin = role === 'Admin';
let produkList = [];  // cache dari server

/* ── TOPBAR MENU ── */
(function buildNav(){
  const nav = document.getElementById('navMenu');
  if(!nav) return;
  nav.innerHTML = `
    <a href="dashboard.html">Dashboard</a>
    <a href="produk.html" class="active">Produk</a>
    ${isAdmin ? '<a href="pesanan.html">Pesanan</a>' : '<a class="disabled" title="Hanya Admin">Pesanan 🔒</a>'}
    ${isAdmin ? '<a href="customer.html">Customer</a>' : '<a class="disabled" title="Hanya Admin">Customer 🔒</a>'}
    <span class="badge-role ${isAdmin?'admin':'pengguna'}">${isAdmin?'👑 Admin':'👤 Pengguna'}</span>
    <a href="#" onclick="logout()">Logout</a>
  `;
  if(isAdmin) document.getElementById('btnTambah').style.display='inline-block';
})();

const ICON_MAP = {Makanan:'🍖',Pasir:'🪣',Mainan:'🎾',Aksesoris:'🎀',Kandang:'🏠',Kesehatan:'💊'};

/* ── LOAD PRODUK DARI SERVER ── */
async function loadProduk(){
  const q   = document.getElementById('searchInput').value;
  const kat = document.getElementById('filterKat').value;
  const url = `/api/produk?q=${encodeURIComponent(q)}&kategori=${encodeURIComponent(kat)}`;
  const res  = await fetch(url, { credentials:'include' });
  const json = await res.json();
  if(!res.ok){ window.location.href='login.html'; return; }
  produkList = json.data;
  renderProduk();
}

function renderProduk(){
  const grid  = document.getElementById('productGrid');
  const empty = document.getElementById('emptyState');
  if(produkList.length === 0){ grid.innerHTML=''; empty.style.display='block'; }
  else {
    empty.style.display='none';
    grid.innerHTML = produkList.map(p => {
      const icon = ICON_MAP[p.kategori] || '📦';
      const low  = p.stok <= 10;
      return `
        <div class="prod-card">
          <span class="badge-stok ${low?'low':''}">${low?'⚠️ ':''}${p.stok} stok</span>
          <div class="prod-icon">${icon}</div>
          <h6>${p.nama}</h6>
          <div class="kategori">${p.kategori}</div>
          <div class="harga">Rp ${Number(p.harga).toLocaleString('id-ID')}</div>
          <div class="terjual">🛒 ${p.terjual} terjual</div>
          ${isAdmin ? `<div class="card-actions">
            <button class="btn-edit" onclick="editProduk(${p.id})">✏️ Edit</button>
            <button class="btn-del"  onclick="hapusProduk(${p.id})">🗑️ Hapus</button>
          </div>` : ''}
        </div>`;
    }).join('');
  }
  updateStats();
}

function updateStats(){
  const kat = [...new Set(produkList.map(p=>p.kategori))];
  document.getElementById('totalProduk').textContent  = produkList.length;
  document.getElementById('stokAman').textContent     = produkList.filter(p=>p.stok>10).length;
  document.getElementById('stokRendah').textContent   = produkList.filter(p=>p.stok<=10).length;
  document.getElementById('totalKategori').textContent= kat.length;
}

/* ── MODAL ── */
function bukaModal(){ document.getElementById('modalOverlay').classList.add('show'); resetForm(); }
function tutupModal(){ document.getElementById('modalOverlay').classList.remove('show'); }
function resetForm(){
  document.getElementById('modalTitle').textContent='Tambah Produk';
  document.getElementById('editId').value='';
  ['fNama','fHarga','fStok'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fKat').value='Makanan';
}

function editProduk(id){
  const p = produkList.find(x=>x.id===id);
  document.getElementById('modalTitle').textContent='Edit Produk';
  document.getElementById('editId').value=id;
  document.getElementById('fNama').value=p.nama;
  document.getElementById('fKat').value=p.kategori;
  document.getElementById('fHarga').value=p.harga;
  document.getElementById('fStok').value=p.stok;
  document.getElementById('modalOverlay').classList.add('show');
}

async function simpanProduk(){
  const nama    = document.getElementById('fNama').value.trim();
  const kategori= document.getElementById('fKat').value;
  const harga   = parseInt(document.getElementById('fHarga').value);
  const stok    = parseInt(document.getElementById('fStok').value);
  if(!nama||isNaN(harga)||isNaN(stok)){ toast('Lengkapi semua field!'); return; }

  const eid    = document.getElementById('editId').value;
  const method = eid ? 'PUT' : 'POST';
  const url    = eid ? `/api/produk/${eid}` : '/api/produk';
  const res = await fetch(url, {
    method, credentials:'include',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({nama, kategori, harga, stok})
  });
  const json = await res.json();
  toast(json.message, res.ok ? 'success' : '');
  if(res.ok){ tutupModal(); loadProduk(); }
}

async function hapusProduk(id){
  if(!confirm('Hapus produk ini?')) return;
  const res  = await fetch(`/api/produk/${id}`, { method:'DELETE', credentials:'include' });
  const json = await res.json();
  toast(json.message, 'success');
  loadProduk();
}

/* ── TOAST ── */
function toast(msg, type=''){
  const w = document.getElementById('toastWrap');
  const d = document.createElement('div');
  d.className='toast-msg '+(type==='success'?'success':'');
  d.textContent=msg; w.appendChild(d);
  setTimeout(()=>d.remove(),3000);
}

/* ── LOGOUT ── */
async function logout(){
  await fetch('/api/logout',{method:'POST',credentials:'include'});
  sessionStorage.clear();
  window.location.href='login.html';
}

loadProduk();

document.getElementById('modalOverlay').addEventListener('click',function(e){
  if(e.target===this) tutupModal();
});
</script>

</body>
</html>
