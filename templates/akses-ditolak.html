<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akses Ditolak – CatShop</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Nunito',sans-serif;margin:0;padding:0;box-sizing:border-box;}
body{background:linear-gradient(135deg,#fff8fb,#f5f2ff);min-height:100vh;display:flex;justify-content:center;align-items:center;}
.box{background:white;border-radius:30px;padding:50px 40px;text-align:center;width:460px;max-width:95vw;box-shadow:0 20px 50px rgba(0,0,0,.10);animation:popIn .3s ease;}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.icon{font-size:5rem;margin-bottom:20px;}
h2{font-weight:800;color:#ff4f87;margin-bottom:10px;}
p{color:#888;font-size:.95rem;line-height:1.6;margin-bottom:24px;}
.btn-back{background:#ff4f87;color:white;border:none;border-radius:16px;padding:13px 32px;font-weight:800;font-size:1rem;font-family:'Nunito',sans-serif;cursor:pointer;transition:.2s;text-decoration:none;display:inline-block;}
.btn-back:hover{background:#e63f75;color:white;}
.badge{display:inline-block;background:#fff5f8;color:#ff4f87;border-radius:20px;padding:5px 16px;font-size:.82rem;font-weight:800;margin-bottom:18px;}
</style>
</head>
<body>
<div class="box">
  <div class="icon">🚫</div>
  <span class="badge">Akses Terbatas</span>
  <h2>Halaman Tidak Dapat Diakses</h2>
  <p>Maaf, halaman ini hanya dapat diakses oleh <b>Admin</b>.<br>Akun kamu tidak memiliki izin untuk membuka halaman ini.</p>
  <a href="dashboard.html" class="btn-back">← Kembali ke Dashboard</a>
</div>
<script>
// GANTI: localStorage → sessionStorage
if(!sessionStorage.getItem('namaUser')){ window.location.href='login.html'; }
</script>
</body>
</html>
