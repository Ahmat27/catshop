<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesanan – CatShop</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{font-family:'Nunito',sans-serif;}
body{background:#faf7ff;min-height:100vh;}

.topbar{
  background:white;border-radius:25px;margin:20px;
  padding:18px 30px;display:flex;justify-content:space-between;
  align-items:center;box-shadow:0 8px 24px rgba(255,79,135,.10);
}
.logo{font-size:26px;font-weight:800;color:#ff4f87;}
.menu{display:flex;gap:10px;flex-wrap:wrap;}
.menu a{
  text-decoration:none;color:#555;background:#fff5f8;
  padding:9px 18px;border-radius:30px;font-weight:700;font-size:.88rem;transition:.25s;
}
.menu a:hover,.menu a.active{background:#ff4f87;color:white;}

.page{padding:0 20px 30px;}

/* STAT */
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:16px;margin-bottom:24px;}
.stat{background:white;border-radius:22px;padding:22px 18px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.06);}
.stat .icon{font-size:2rem;margin-bottom:6px;}
.stat .number{font-size:1.7rem;font-weight:800;color:#ff4f87;}
.stat .label{font-size:.8rem;color:#888;font-weight:600;}

/* TOOLBAR */
.toolbar{
  background:white;border-radius:22px;padding:16px 22px;margin-bottom:20px;
  display:flex;gap:12px;flex-wrap:wrap;align-items:center;
  box-shadow:0 6px 18px rgba(0,0,0,.06);
}
.toolbar input,.toolbar select{
  border:2px solid #ffe0ec;border-radius:14px;padding:9px 14px;
  font-size:.9rem;font-family:'Nunito',sans-serif;outline:none;transition:.2s;
}
.toolbar input:focus,.toolbar select:focus{border-color:#ff4f87;}
.toolbar input{flex:1;min-width:180px;}
.btn-pink{
  background:#ff4f87;color:white;border:none;border-radius:14px;
  padding:9px 20px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:.2s;white-space:nowrap;
}
.btn-pink:hover{background:#e63f75;}

/* TABLE CARD */
.table-card{background:white;border-radius:24px;padding:24px;box-shadow:0 6px 18px rgba(0,0,0,.06);overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead th{
  background:#fff5f8;color:#ff4f87;font-weight:800;
  padding:12px 14px;font-size:.85rem;text-align:left;
}
thead th:first-child{border-radius:14px 0 0 14px;}
thead th:last-child{border-radius:0 14px 14px 0;}
tbody tr{border-bottom:1px solid #fdf0f5;transition:.2s;}
tbody tr:hover{background:#fffafc;}
tbody td{padding:13px 14px;font-size:.9rem;color:#444;vertical-align:middle;}
tbody tr:last-child{border-bottom:none;}

/* STATUS BADGE */
.badge-status{
  display:inline-block;padding:5px 14px;border-radius:20px;
  font-size:.78rem;font-weight:800;
}
.badge-status.menunggu{background:#fff8e1;color:#f59e0b;}
.badge-status.diproses{background:#e8f4fd;color:#3b82f6;}
.badge-status.dikirim {background:#f0fdf4;color:#22c55e;}
.badge-status.selesai {background:#f0fdf4;color:#16a34a;}
.badge-status.dibatalkan{background:#fff0f0;color:#e53935;}

/* ACTION BTN */
.btn-sm-pink{
  background:#fff5f8;color:#ff4f87;border:none;border-radius:10px;
  padding:6px 12px;font-weight:700;font-family:'Nunito',sans-serif;
  cursor:pointer;font-size:.8rem;transition:.2s;margin:2px;
}
.btn-sm-pink:hover{background:#ffd9e8;}
.btn-sm-red{
  background:#fff0f0;color:#e53935;border:none;border-radius:10px;
  padding:6px 12px;font-weight:700;font-family:'Nunito',sans-serif;
  cursor:pointer;font-size:.8rem;transition:.2s;margin:2px;
}
.btn-sm-red:hover{background:#ffd7d7;}

/* MODAL */
.overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);
  backdrop-filter:blur(4px);z-index:1000;justify-content:center;align-items:center;
}
.overlay.show{display:flex;}
.modal-box{
  background:white;border-radius:28px;padding:35px;
  width:480px;max-width:95vw;
  box-shadow:0 20px 50px rgba(0,0,0,.15);animation:popIn .25s ease;
}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-box h5{font-weight:800;color:#ff4f87;margin-bottom:22px;}
.modal-box label{font-weight:700;font-size:.88rem;color:#555;margin-bottom:5px;display:block;}
.modal-box input,.modal-box select,.modal-box textarea{
  width:100%;border:2px solid #ffe0ec;border-radius:14px;
  padding:10px 14px;font-family:'Nunito',sans-serif;font-size:.9rem;
  outline:none;transition:.2s;margin-bottom:14px;
}
.modal-box input:focus,.modal-box select:focus{border-color:#ff4f87;}
.modal-actions{display:flex;gap:10px;margin-top:6px;}
.btn-cancel{
  flex:1;background:#f5f5f5;color:#666;border:none;border-radius:14px;
  padding:11px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:.2s;
}
.btn-cancel:hover{background:#e8e8e8;}

/* DETAIL MODAL */
.detail-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f5f5f5;font-size:.9rem;}
.detail-row:last-child{border-bottom:none;}
.detail-row .key{color:#999;font-weight:600;}
.detail-row .val{font-weight:700;color:#333;}

/* TOAST */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:2000;}
.toast-msg{background:#ff4f87;color:white;padding:12px 20px;border-radius:16px;font-weight:700;font-size:.88rem;margin-top:8px;animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* EMPTY */
.empty{text-align:center;padding:50px;color:#ccc;}
.empty .icon{font-size:3rem;margin-bottom:10px;}
.empty p{font-weight:700;}
.badge-role{padding:6px 14px;border-radius:20px;font-size:.78rem;font-weight:800;}
.badge-role.admin{background:#fff0f7;color:#ff4f87;}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">🐱 CatShop</div>
  <div class="menu" id="navMenu"></div>
</div>

<div class="page">

  <!-- STAT -->
  <div class="stat-cards">
    <div class="stat"><div class="icon">📋</div><div class="number" id="stTotal">0</div><div class="label">Total Pesanan</div></div>
    <div class="stat"><div class="icon">⏳</div><div class="number" id="stMenunggu">0</div><div class="label">Menunggu</div></div>
    <div class="stat"><div class="icon">🚚</div><div class="number" id="stDikirim">0</div><div class="label">Dikirim</div></div>
    <div class="stat"><div class="icon">✅</div><div class="number" id="stSelesai">0</div><div class="label">Selesai</div></div>
    <div class="stat"><div class="icon">💰</div><div class="number" id="stOmzet">0</div><div class="label">Total Omzet</div></div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="🔍  Cari nama / produk..." oninput="loadPesanan()">
    <select id="filterStatus" onchange="loadPesanan()">
      <option value="">Semua Status</option>
      <option>Menunggu</option>
      <option>Diproses</option>
      <option>Dikirim</option>
      <option>Selesai</option>
      <option>Dibatalkan</option>
    </select>
    <button class="btn-pink" onclick="bukaModal()">+ Tambah Pesanan</button>
  </div>

  <!-- TABLE -->
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>#ID</th>
          <th>Customer</th>
          <th>Produk</th>
          <th>Qty</th>
          <th>Total</th>
          <th>Status</th>
          <th>Tanggal</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="tablePesanan"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none">
      <div class="icon">🛒</div>
      <p>Belum ada pesanan ditemukan.</p>
    </div>
  </div>

</div>

<!-- MODAL TAMBAH / EDIT -->
<div class="overlay" id="modalOverlay">
  <div class="modal-box">
    <h5 id="modalTitle">Tambah Pesanan</h5>
    <input type="hidden" id="editId">
    <label>Nama Customer</label>
    <input type="text" id="fCustomer" placeholder="Nama customer">
    <label>Produk</label>
    <input type="text" id="fProduk" placeholder="Nama produk">
    <label>Jumlah (Qty)</label>
    <input type="number" id="fQty" value="1" min="1">
    <label>Total Harga (Rp)</label>
    <input type="number" id="fTotal" placeholder="120000" min="0">
    <label>Status</label>
    <select id="fStatus">
      <option>Menunggu</option>
      <option>Diproses</option>
      <option>Dikirim</option>
      <option>Selesai</option>
      <option>Dibatalkan</option>
    </select>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="tutupModal()">Batal</button>
      <button class="btn-pink" style="flex:1" onclick="simpanPesanan()">Simpan</button>
    </div>
  </div>
</div>

<!-- MODAL DETAIL -->
<div class="overlay" id="detailOverlay">
  <div class="modal-box">
    <h5>📋 Detail Pesanan</h5>
    <div id="detailContent"></div>
    <div class="modal-actions" style="margin-top:16px">
      <button class="btn-cancel" style="width:100%" onclick="tutupDetail()">Tutup</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast-wrap" id="toastWrap"></div>

<script>
// ── GANTI: localStorage → fetch Flask API ──
let namaUser = sessionStorage.getItem('namaUser');
let roleUser  = sessionStorage.getItem('roleUser');
if(!namaUser){ window.location.href='login.html'; }
if(roleUser !== 'Admin'){ window.location.href='akses-ditolak.html'; }

const isAdmin = roleUser === 'Admin';
let pesananList = [];

/* ── TOPBAR MENU ── */
(function buildNav(){
  const nav = document.getElementById('navMenu');
  if(!nav) return;
  nav.innerHTML = `
    <a href="dashboard.html">Dashboard</a>
    <a href="produk.html">Produk</a>
    <a href="pesanan.html" class="active">Pesanan</a>
    <a href="customer.html">Customer</a>
    <span class="badge-role admin">👑 Admin</span>
    <a href="#" onclick="logout()">Logout</a>
  `;
})();

/* ── LOAD PESANAN DARI SERVER ── */
async function loadPesanan(){
  const q  = document.getElementById('searchInput').value;
  const st = document.getElementById('filterStatus').value;
  const url= `/api/pesanan?q=${encodeURIComponent(q)}&status=${encodeURIComponent(st)}`;
  const res  = await fetch(url, { credentials:'include' });
  const json = await res.json();
  if(!res.ok){ window.location.href='login.html'; return; }
  pesananList = json.data;
  renderPesanan();
}

function renderPesanan(){
  const tbody = document.getElementById('tablePesanan');
  const empty = document.getElementById('emptyState');
  if(pesananList.length===0){ tbody.innerHTML=''; empty.style.display='block'; }
  else{
    empty.style.display='none';
    tbody.innerHTML = pesananList.map(p => `
      <tr>
        <td><b style="color:#ff4f87">${p.id}</b></td>
        <td>${p.customer}</td>
        <td>${p.produk}</td>
        <td>${p.qty}</td>
        <td><b>Rp ${Number(p.total).toLocaleString('id-ID')}</b></td>
        <td><span class="badge-status ${p.status.toLowerCase()}">${p.status}</span></td>
        <td>${p.tanggal}</td>
        <td>
          <button class="btn-sm-pink" onclick="lihatDetail('${p.id}')">👁️</button>
          <button class="btn-sm-pink" onclick="editPesanan('${p.id}')">✏️</button>
          <button class="btn-sm-red"  onclick="hapusPesanan('${p.id}')">🗑️</button>
        </td>
      </tr>`).join('');
  }
  updateStats();
}

function updateStats(){
  const omzet = pesananList.filter(p=>p.status==='Selesai').reduce((a,b)=>a+Number(b.total),0);
  document.getElementById('stTotal').textContent    = pesananList.length;
  document.getElementById('stMenunggu').textContent = pesananList.filter(p=>p.status==='Menunggu').length;
  document.getElementById('stDikirim').textContent  = pesananList.filter(p=>p.status==='Dikirim').length;
  document.getElementById('stSelesai').textContent  = pesananList.filter(p=>p.status==='Selesai').length;
  document.getElementById('stOmzet').textContent    = (omzet/1000000).toFixed(1)+'jt';
}

/* ── MODAL ── */
function bukaModal(){ document.getElementById('modalOverlay').classList.add('show'); resetForm(); }
function tutupModal(){ document.getElementById('modalOverlay').classList.remove('show'); }
function tutupDetail(){ document.getElementById('detailOverlay').classList.remove('show'); }

function resetForm(){
  document.getElementById('modalTitle').textContent='Tambah Pesanan';
  document.getElementById('editId').value='';
  ['fCustomer','fProduk'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fQty').value=1;
  document.getElementById('fTotal').value='';
  document.getElementById('fStatus').value='Menunggu';
}

function editPesanan(id){
  const p = pesananList.find(x=>x.id===id);
  document.getElementById('modalTitle').textContent='Edit Pesanan';
  document.getElementById('editId').value=id;
  document.getElementById('fCustomer').value=p.customer;
  document.getElementById('fProduk').value=p.produk;
  document.getElementById('fQty').value=p.qty;
  document.getElementById('fTotal').value=p.total;
  document.getElementById('fStatus').value=p.status;
  document.getElementById('modalOverlay').classList.add('show');
}

async function simpanPesanan(){
  const customer = document.getElementById('fCustomer').value.trim();
  const produk   = document.getElementById('fProduk').value.trim();
  const qty      = parseInt(document.getElementById('fQty').value);
  const total    = parseInt(document.getElementById('fTotal').value);
  const status   = document.getElementById('fStatus').value;
  if(!customer||!produk||isNaN(qty)||isNaN(total)){ toast('Lengkapi semua field!'); return; }

  const eid    = document.getElementById('editId').value;
  const method = eid ? 'PUT' : 'POST';
  const url    = eid ? `/api/pesanan/${eid}` : '/api/pesanan';
  const res = await fetch(url, {
    method, credentials:'include',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({customer, produk, qty, total, status})
  });
  const json = await res.json();
  toast(json.message);
  if(res.ok){ tutupModal(); loadPesanan(); }
}

async function hapusPesanan(id){
  if(!confirm('Hapus pesanan ini?')) return;
  const res  = await fetch(`/api/pesanan/${id}`, { method:'DELETE', credentials:'include' });
  const json = await res.json();
  toast(json.message);
  loadPesanan();
}

function lihatDetail(id){
  const p = pesananList.find(x=>x.id===id);
  document.getElementById('detailContent').innerHTML = `
    <div class="detail-row"><span class="key">ID Pesanan</span><span class="val">${p.id}</span></div>
    <div class="detail-row"><span class="key">Customer</span><span class="val">${p.customer}</span></div>
    <div class="detail-row"><span class="key">Produk</span><span class="val">${p.produk}</span></div>
    <div class="detail-row"><span class="key">Jumlah</span><span class="val">${p.qty} pcs</span></div>
    <div class="detail-row"><span class="key">Total</span><span class="val">Rp ${Number(p.total).toLocaleString('id-ID')}</span></div>
    <div class="detail-row"><span class="key">Status</span><span class="val"><span class="badge-status ${p.status.toLowerCase()}">${p.status}</span></span></div>
    <div class="detail-row"><span class="key">Tanggal</span><span class="val">${p.tanggal}</span></div>
  `;
  document.getElementById('detailOverlay').classList.add('show');
}

/* ── TOAST ── */
function toast(msg){ const w=document.getElementById('toastWrap'); const d=document.createElement('div'); d.className='toast-msg'; d.textContent=msg; w.appendChild(d); setTimeout(()=>d.remove(),3000); }

/* ── LOGOUT ── */
async function logout(){
  await fetch('/api/logout',{method:'POST',credentials:'include'});
  sessionStorage.clear();
  window.location.href='login.html';
}

loadPesanan();

document.getElementById('modalOverlay').addEventListener('click',function(e){ if(e.target===this) tutupModal(); });
document.getElementById('detailOverlay').addEventListener('click',function(e){ if(e.target===this) tutupDetail(); });
</script>

</body>
</html>
