<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer – CatShop</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{font-family:'Nunito',sans-serif;}
body{background:#faf7ff;min-height:100vh;}

.topbar{
  background:white;border-radius:25px;margin:20px;
  padding:18px 30px;display:flex;justify-content:space-between;
  align-items:center;box-shadow:0 8px 24px rgba(255,79,135,.10);
}
.logo{font-size:26px;font-weight:800;color:#ff4f87;}
.menu{display:flex;gap:10px;flex-wrap:wrap;}
.menu a{
  text-decoration:none;color:#555;background:#fff5f8;
  padding:9px 18px;border-radius:30px;font-weight:700;font-size:.88rem;transition:.25s;
}
.menu a:hover,.menu a.active{background:#ff4f87;color:white;}

.page{padding:0 20px 30px;}

/* STAT */
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:16px;margin-bottom:24px;}
.stat{background:white;border-radius:22px;padding:22px 18px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.06);}
.stat .icon{font-size:2rem;margin-bottom:6px;}
.stat .number{font-size:1.7rem;font-weight:800;color:#ff4f87;}
.stat .label{font-size:.8rem;color:#888;font-weight:600;}

/* TOOLBAR */
.toolbar{
  background:white;border-radius:22px;padding:16px 22px;margin-bottom:20px;
  display:flex;gap:12px;flex-wrap:wrap;align-items:center;
  box-shadow:0 6px 18px rgba(0,0,0,.06);
}
.toolbar input,.toolbar select{
  border:2px solid #ffe0ec;border-radius:14px;padding:9px 14px;
  font-size:.9rem;font-family:'Nunito',sans-serif;outline:none;transition:.2s;
}
.toolbar input:focus,.toolbar select:focus{border-color:#ff4f87;}
.toolbar input{flex:1;min-width:180px;}
.btn-pink{
  background:#ff4f87;color:white;border:none;border-radius:14px;
  padding:9px 20px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:.2s;white-space:nowrap;
}
.btn-pink:hover{background:#e63f75;}

/* CUSTOMER GRID */
.customer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;}
.cust-card{
  background:white;border-radius:24px;padding:24px;
  box-shadow:0 6px 18px rgba(0,0,0,.06);transition:.25s;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  position:relative;overflow:hidden;
}
.cust-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(255,79,135,.14);}
.cust-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:6px;
  background:linear-gradient(90deg,#ff6fa0,#ffb6cc);
}
.avatar{
  width:72px;height:72px;border-radius:50%;margin-bottom:14px;margin-top:6px;
  background:linear-gradient(135deg,#ff6fa0,#ffb6cc);
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;font-weight:800;color:white;flex-shrink:0;
}
.cust-card h6{font-weight:800;font-size:1rem;margin-bottom:2px;color:#333;}
.cust-card .email{font-size:.82rem;color:#aaa;margin-bottom:10px;}
.cust-card .phone{font-size:.85rem;color:#555;margin-bottom:6px;}
.cust-meta{display:flex;gap:10px;margin-bottom:14px;}
.meta-pill{
  background:#fff5f8;color:#ff4f87;border-radius:20px;
  padding:4px 12px;font-size:.78rem;font-weight:700;
}
.badge-vip{background:#fff8e1;color:#f59e0b;}
.card-actions{display:flex;gap:8px;width:100%;}
.btn-edit{
  flex:1;background:#fff5f8;color:#ff4f87;border:none;border-radius:12px;
  padding:8px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:.2s;font-size:.85rem;
}
.btn-edit:hover{background:#ffd9e8;}
.btn-del{
  flex:1;background:#fff0f0;color:#e53935;border:none;border-radius:12px;
  padding:8px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:.2s;font-size:.85rem;
}
.btn-del:hover{background:#ffd7d7;}

/* MODAL */
.overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);
  backdrop-filter:blur(4px);z-index:1000;justify-content:center;align-items:center;
}
.overlay.show{display:flex;}
.modal-box{
  background:white;border-radius:28px;padding:35px;width:480px;max-width:95vw;
  box-shadow:0 20px 50px rgba(0,0,0,.15);animation:popIn .25s ease;
}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-box h5{font-weight:800;color:#ff4f87;margin-bottom:22px;}
.modal-box label{font-weight:700;font-size:.88rem;color:#555;margin-bottom:5px;display:block;}
.modal-box input,.modal-box select,.modal-box textarea{
  width:100%;border:2px solid #ffe0ec;border-radius:14px;
  padding:10px 14px;font-family:'Nunito',sans-serif;font-size:.9rem;
  outline:none;transition:.2s;margin-bottom:14px;
}
.modal-box input:focus,.modal-box select:focus{border-color:#ff4f87;}
.modal-actions{display:flex;gap:10px;margin-top:6px;}
.btn-cancel{
  flex:1;background:#f5f5f5;color:#666;border:none;border-radius:14px;
  padding:11px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:.2s;
}
.btn-cancel:hover{background:#e8e8e8;}

/* DETAIL ROW */
.detail-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f5f5f5;font-size:.9rem;}
.detail-row:last-child{border-bottom:none;}
.detail-row .key{color:#999;font-weight:600;}
.detail-row .val{font-weight:700;color:#333;}

/* TOAST */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:2000;}
.toast-msg{background:#ff4f87;color:white;padding:12px 20px;border-radius:16px;font-weight:700;font-size:.88rem;margin-top:8px;animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* EMPTY */
.empty{text-align:center;padding:60px;color:#ccc;}
.empty .icon{font-size:3.5rem;margin-bottom:12px;}
.empty p{font-weight:700;}

/* INPUT ROW */
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.badge-role{padding:6px 14px;border-radius:20px;font-size:.78rem;font-weight:800;}
.badge-role.admin{background:#fff0f7;color:#ff4f87;}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">🐱 CatShop</div>
  <div class="menu" id="navMenu"></div>
</div>

<div class="page">

  <!-- STAT -->
  <div class="stat-cards">
    <div class="stat"><div class="icon">👥</div><div class="number" id="stTotal">0</div><div class="label">Total Customer</div></div>
    <div class="stat"><div class="icon">⭐</div><div class="number" id="stVip">0</div><div class="label">VIP</div></div>
    <div class="stat"><div class="icon">🆕</div><div class="number" id="stBaru">0</div><div class="label">Customer Baru</div></div>
    <div class="stat"><div class="icon">🛒</div><div class="number" id="stPesanan">0</div><div class="label">Total Pesanan</div></div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="🔍  Cari nama / email..." oninput="loadCustomer()">
    <select id="filterTipe" onchange="loadCustomer()">
      <option value="">Semua Tipe</option>
      <option>VIP</option>
      <option>Reguler</option>
      <option>Baru</option>
    </select>
    <button class="btn-pink" onclick="bukaModal()">+ Tambah Customer</button>
  </div>

  <!-- GRID -->
  <div class="customer-grid" id="customerGrid"></div>
  <div class="empty" id="emptyState" style="display:none">
    <div class="icon">👥</div>
    <p>Belum ada customer ditemukan.</p>
  </div>

</div>

<!-- MODAL TAMBAH / EDIT -->
<div class="overlay" id="modalOverlay">
  <div class="modal-box">
    <h5 id="modalTitle">Tambah Customer</h5>
    <input type="hidden" id="editId">
    <label>Nama Lengkap</label>
    <input type="text" id="fNama" placeholder="Nama customer">
    <div class="input-row">
      <div>
        <label>No. HP</label>
        <input type="text" id="fHp" placeholder="081234...">
      </div>
      <div>
        <label>Tipe</label>
        <select id="fTipe">
          <option>Baru</option>
          <option>Reguler</option>
          <option>VIP</option>
        </select>
      </div>
    </div>
    <label>Email</label>
    <input type="email" id="fEmail" placeholder="email@contoh.com">
    <label>Alamat</label>
    <input type="text" id="fAlamat" placeholder="Jl. ...">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="tutupModal()">Batal</button>
      <button class="btn-pink" style="flex:1" onclick="simpanCustomer()">Simpan</button>
    </div>
  </div>
</div>

<!-- MODAL DETAIL -->
<div class="overlay" id="detailOverlay">
  <div class="modal-box">
    <h5>👤 Profil Customer</h5>
    <div id="detailContent"></div>
    <div class="modal-actions" style="margin-top:16px">
      <button class="btn-cancel" style="width:100%" onclick="tutupDetail()">Tutup</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast-wrap" id="toastWrap"></div>

<script>
// ── GANTI: localStorage → fetch Flask API ──
let namaUser = sessionStorage.getItem('namaUser');
let roleUser  = sessionStorage.getItem('roleUser');
if(!namaUser){ window.location.href='login.html'; }
if(roleUser !== 'Admin'){ window.location.href='akses-ditolak.html'; }

const isAdmin = roleUser === 'Admin';
let custList = [];

/* ── TOPBAR MENU ── */
(function buildNav(){
  const nav = document.getElementById('navMenu');
  if(!nav) return;
  nav.innerHTML = `
    <a href="dashboard.html">Dashboard</a>
    <a href="produk.html">Produk</a>
    <a href="pesanan.html">Pesanan</a>
    <a href="customer.html" class="active">Customer</a>
    <span class="badge-role admin">👑 Admin</span>
    <a href="#" onclick="logout()">Logout</a>
  `;
})();

function inisial(nama){ return nama.split(' ').slice(0,2).map(n=>n[0]).join('').toUpperCase(); }

/* ── LOAD CUSTOMER DARI SERVER ── */
async function loadCustomer(){
  const q    = document.getElementById('searchInput').value;
  const tipe = document.getElementById('filterTipe').value;
  const url  = `/api/customer?q=${encodeURIComponent(q)}&tipe=${encodeURIComponent(tipe)}`;
  const res  = await fetch(url, { credentials:'include' });
  const json = await res.json();
  if(!res.ok){ window.location.href='login.html'; return; }
  custList = json.data;
  renderCustomer();
}

function renderCustomer(){
  const grid  = document.getElementById('customerGrid');
  const empty = document.getElementById('emptyState');
  if(custList.length===0){ grid.innerHTML=''; empty.style.display='block'; }
  else{
    empty.style.display='none';
    grid.innerHTML = custList.map(c => `
      <div class="cust-card">
        <div class="avatar">${inisial(c.nama)}</div>
        <h6>${c.nama}</h6>
        <div class="email">${c.email}</div>
        <div class="phone">📱 ${c.hp}</div>
        <div class="cust-meta">
          <span class="meta-pill ${c.tipe==='VIP'?'badge-vip':''}">${c.tipe==='VIP'?'⭐ ':''}${c.tipe}</span>
          <span class="meta-pill">🛒 ${c.pesanan} pesanan</span>
        </div>
        <div class="card-actions">
          <button class="btn-edit" onclick="lihatDetail(${c.id})">👁️ Detail</button>
          <button class="btn-edit" onclick="editCustomer(${c.id})" style="background:#f0f0ff;color:#6366f1">✏️</button>
          <button class="btn-del"  onclick="hapusCustomer(${c.id})">🗑️</button>
        </div>
      </div>`).join('');
  }
  updateStats();
}

function updateStats(){
  const totalPesanan = custList.reduce((a,b)=>a+Number(b.pesanan),0);
  document.getElementById('stTotal').textContent   = custList.length;
  document.getElementById('stVip').textContent     = custList.filter(c=>c.tipe==='VIP').length;
  document.getElementById('stBaru').textContent    = custList.filter(c=>c.tipe==='Baru').length;
  document.getElementById('stPesanan').textContent = totalPesanan;
}

/* ── MODAL ── */
function bukaModal(){ document.getElementById('modalOverlay').classList.add('show'); resetForm(); }
function tutupModal(){ document.getElementById('modalOverlay').classList.remove('show'); }
function tutupDetail(){ document.getElementById('detailOverlay').classList.remove('show'); }

function resetForm(){
  document.getElementById('modalTitle').textContent='Tambah Customer';
  document.getElementById('editId').value='';
  ['fNama','fHp','fEmail','fAlamat'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fTipe').value='Baru';
}

function editCustomer(id){
  const c = custList.find(x=>x.id===id);
  document.getElementById('modalTitle').textContent='Edit Customer';
  document.getElementById('editId').value=id;
  document.getElementById('fNama').value=c.nama;
  document.getElementById('fHp').value=c.hp;
  document.getElementById('fEmail').value=c.email;
  document.getElementById('fAlamat').value=c.alamat||'';
  document.getElementById('fTipe').value=c.tipe;
  document.getElementById('modalOverlay').classList.add('show');
}

async function simpanCustomer(){
  const nama   = document.getElementById('fNama').value.trim();
  const hp     = document.getElementById('fHp').value.trim();
  const email  = document.getElementById('fEmail').value.trim();
  const alamat = document.getElementById('fAlamat').value.trim();
  const tipe   = document.getElementById('fTipe').value;
  if(!nama||!hp||!email){ toast('Lengkapi nama, HP, dan email!'); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast('Format email tidak valid!'); return; }

  const eid    = document.getElementById('editId').value;
  const method = eid ? 'PUT' : 'POST';
  const url    = eid ? `/api/customer/${eid}` : '/api/customer';
  const res = await fetch(url, {
    method, credentials:'include',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({nama, hp, email, alamat, tipe})
  });
  const json = await res.json();
  toast(json.message);
  if(res.ok){ tutupModal(); loadCustomer(); }
}

async function hapusCustomer(id){
  if(!confirm('Hapus customer ini?')) return;
  const res  = await fetch(`/api/customer/${id}`, { method:'DELETE', credentials:'include' });
  const json = await res.json();
  toast(json.message);
  loadCustomer();
}

function lihatDetail(id){
  const c = custList.find(x=>x.id===id);
  document.getElementById('detailContent').innerHTML = `
    <div style="text-align:center;margin-bottom:18px">
      <div class="avatar" style="margin:0 auto 10px;width:80px;height:80px;font-size:2.2rem">${inisial(c.nama)}</div>
      <h6 style="font-weight:800;font-size:1.1rem;margin-bottom:2px">${c.nama}</h6>
      <span class="meta-pill" style="display:inline-block;margin:4px;background:#fff5f8;color:#ff4f87;border-radius:20px;padding:4px 14px;font-size:.8rem;font-weight:800">${c.tipe==='VIP'?'⭐ ':''}${c.tipe}</span>
    </div>
    <div class="detail-row"><span class="key">📧 Email</span><span class="val">${c.email}</span></div>
    <div class="detail-row"><span class="key">📱 HP</span><span class="val">${c.hp}</span></div>
    <div class="detail-row"><span class="key">📍 Alamat</span><span class="val">${c.alamat||'-'}</span></div>
    <div class="detail-row"><span class="key">📅 Bergabung</span><span class="val">${c.joined}</span></div>
    <div class="detail-row"><span class="key">🛒 Total Pesanan</span><span class="val">${c.pesanan} pesanan</span></div>
  `;
  document.getElementById('detailOverlay').classList.add('show');
}

/* ── TOAST ── */
function toast(msg){ const w=document.getElementById('toastWrap'); const d=document.createElement('div'); d.className='toast-msg'; d.textContent=msg; w.appendChild(d); setTimeout(()=>d.remove(),3000); }

/* ── LOGOUT ── */
async function logout(){
  await fetch('/api/logout',{method:'POST',credentials:'include'});
  sessionStorage.clear();
  window.location.href='login.html';
}

loadCustomer();

document.getElementById('modalOverlay').addEventListener('click',function(e){ if(e.target===this) tutupModal(); });
document.getElementById('detailOverlay').addEventListener('click',function(e){ if(e.target===this) tutupDetail(); });
</script>

</body>
</html>
