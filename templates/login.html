<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Login CatShop</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(
        135deg,
        #fff8fb,
        #f5f2ff
    );
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* CARD */

.login-box{
    width:900px;
    background:white;
    border-radius:30px;
    overflow:hidden;
    display:grid;
    grid-template-columns:1fr 1fr;
    box-shadow:0 15px 35px rgba(0,0,0,.08);
}

/* LEFT */

.left{
    background:linear-gradient(
        135deg,
        #ff6fa0,
        #ffb6cc
    );
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:40px;
    text-align:center;
}

.left h1{
    font-weight:bold;
}

/* RIGHT */

.right{
    padding:45px;
}

.right h3{
    font-weight:bold;
    color:#ff4f87;
    margin-bottom:25px;
}

.form-control{
    border-radius:15px;
    padding:12px;
    margin-bottom:15px;
}

/* ROLE */

.role-box{
    display:flex;
    gap:15px;
    margin-bottom:20px;
}

.role-option{
    flex:1;
    text-align:center;
    background:#fff5f8;
    padding:12px;
    border-radius:15px;
    cursor:pointer;
    font-weight:bold;
    transition:.3s;
}

.role-option:hover{
    background:#ffd9e8;
}

/* BUTTON */

.btn-login{
    width:100%;
    border:none;
    background:#ff4f87;
    color:white;
    padding:12px;
    border-radius:15px;
    font-weight:bold;
}

.btn-login:hover{
    background:#e63f75;
}

#error{
    color:red;
    text-align:center;
    margin-top:10px;
}

</style>
</head>
<body>

<div class="login-box">

    <!-- LEFT -->
    <div class="left">

        <h1>🐱 CatShop</h1>

        <p>
            Kelola toko kucingmu
            dengan mudah dan cepat.
        </p>

    </div>

    <!-- RIGHT -->
    <div class="right">

        <h3>Login Akun</h3>

        <form onsubmit="login(event)">

            <!-- ROLE -->
            <div class="role-box">

                <label class="role-option">
                    <input
                        type="radio"
                        name="role"
                        value="admin"
                        required>
                    Admin
                </label>

                <label class="role-option">
                    <input
                        type="radio"
                        name="role"
                        value="pengguna"
                        required>
                    Pengguna
                </label>

            </div>

            <!-- USERNAME -->
            <input
                type="text"
                id="username"
                class="form-control"
                placeholder="Username"
                required>

            <!-- PASSWORD -->
            <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Password"
                required>

            <!-- BUTTON -->
            <button
                type="submit"
                class="btn-login">
                Login
            </button>

            <p id="error"></p>

        </form>

    </div>

</div>

<script>

// ── GANTI: localStorage → fetch ke Flask API ──
async function login(event){

    event.preventDefault();

    const role =
        document.querySelector(
            'input[name="role"]:checked'
        ).value;

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role, username, password })
        });

        const json = await res.json();

        if (res.ok) {
            // Simpan di sessionStorage agar halaman lain bisa baca
            // (session asli ada di server Flask)
            sessionStorage.setItem('namaUser', json.data.namaUser);
            sessionStorage.setItem('roleUser', json.data.roleUser);
            window.location.href = 'dashboard.html';
        } else {
            document.getElementById('error').innerText = json.message;
        }
    } catch(e) {
        document.getElementById('error').innerText =
            'Tidak dapat terhubung ke server. Pastikan Flask sudah berjalan.';
    }
}

</script>

</body>
</html>
